[package]
name = "app"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.18"
actix-files = "0.7"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync", "time"] }
alloy = { version = "2.5", features = ["provider-http", "provider-ws", "rpc-types"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
base64 = "0.22"
chrono = "0.4"
bigdecimal = "0.4"
railgun-scanner-handle = { path = "../scanner/crates/handle" }
